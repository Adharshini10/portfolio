<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSync" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1E3"/>
      <stop offset="50%" stop-color="#F5E4D3"/>
      <stop offset="100%" stop-color="#EAD5C2"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF8F0"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#38251F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#bgSync)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#D8B99B" stroke-width="1" opacity="0.35">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Central Platform Window / Dashboard Mockup -->
  <g transform="translate(80, 50)" filter="url(#cardShadow)">
    <rect width="640" height="400" rx="16" fill="url(#cardGrad)" stroke="#D8B99B" stroke-width="2"/>
    
    <!-- Window Bar -->
    <rect width="640" height="44" rx="16" fill="#38251F"/>
    <rect y="30" width="640" height="14" fill="#38251F"/>
    <circle cx="28" cy="22" r="5" fill="#702735"/>
    <circle cx="44" cy="22" r="5" fill="#D8B99B"/>
    <circle cx="60" cy="22" r="5" fill="#FFF1E3"/>
    <text x="320" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFF1E3" text-anchor="middle" letter-spacing="1">SKILLSYNC • COLLABORATION PLATFORM</text>

    <!-- Sidebar -->
    <rect x="0" y="44" width="160" height="356" fill="#FBF3EC" stroke="#D8B99B" stroke-width="1"/>
    <text x="24" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#702735" letter-spacing="1">DISCOVERY</text>
    <rect x="18" y="94" width="124" height="28" rx="6" fill="#702735"/>
    <text x="32" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#FFF1E3">Skill Swaps</text>
    
    <rect x="18" y="132" width="124" height="28" rx="6" fill="#FFF1E3" stroke="#D8B99B" stroke-width="1"/>
    <text x="32" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#38251F">Projects Hub</text>

    <rect x="18" y="170" width="124" height="28" rx="6" fill="#FFF1E3" stroke="#D8B99B" stroke-width="1"/>
    <text x="32" y="188" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#38251F">Connections</text>

    <!-- Main Content Area: Matching Profiles & Swaps -->
    <g transform="translate(180, 64)">
      <!-- Header search / match stats -->
      <rect width="440" height="42" rx="8" fill="#FFF1E3" stroke="#D8B99B" stroke-width="1"/>
      <circle cx="20" cy="21" r="7" fill="none" stroke="#702735" stroke-width="2"/>
      <line x1="25" y1="26" x2="31" y2="32" stroke="#702735" stroke-width="2"/>
      <text x="42" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#38251F" opacity="0.65">Search skills (Java, React, Spring Boot, MySQL...)</text>

      <!-- Match Cards Grid -->
      <!-- Card 1 -->
      <g transform="translate(0, 60)">
        <rect width="210" height="150" rx="10" fill="#FFFFFF" stroke="#D8B99B" stroke-width="1.5"/>
        <circle cx="32" cy="34" r="18" fill="#702735"/>
        <text x="32" y="39" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFF1E3" text-anchor="middle">JS</text>
        <text x="60" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#38251F">React & UI Dev</text>
        <text x="60" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#702735" font-weight="600">Offers: React, Tailwind</text>
        <text x="18" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#38251F" opacity="0.75">Seeking: Spring Boot / Java</text>
        
        <rect x="18" y="90" width="85" height="20" rx="10" fill="#D8B99B" fill-opacity="0.35"/>
        <text x="60" y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#38251F" text-anchor="middle">98% MATCH</text>
        
        <rect x="110" y="90" width="85" height="20" rx="10" fill="#702735"/>
        <text x="152" y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#FFF1E3" text-anchor="middle">CONNECT</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(230, 60)">
        <rect width="210" height="150" rx="10" fill="#FFFFFF" stroke="#D8B99B" stroke-width="1.5"/>
        <circle cx="32" cy="34" r="18" fill="#38251F"/>
        <text x="32" y="39" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#D8B99B" text-anchor="middle">SB</text>
        <text x="60" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#38251F">Spring Engineer</text>
        <text x="60" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#702735" font-weight="600">Offers: Spring Boot, APIs</text>
        <text x="18" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#38251F" opacity="0.75">Seeking: React Frontend</text>

        <rect x="18" y="90" width="85" height="20" rx="10" fill="#D8B99B" fill-opacity="0.35"/>
        <text x="60" y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#38251F" text-anchor="middle">95% MATCH</text>

        <rect x="110" y="90" width="85" height="20" rx="10" fill="#702735"/>
        <text x="152" y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#FFF1E3" text-anchor="middle">CONNECT</text>
      </g>

      <!-- Realtime Collaboration Bar (WebSocket) -->
      <g transform="translate(0, 226)">
        <rect width="440" height="42" rx="8" fill="#F4E8DC" stroke="#D8B99B" stroke-width="1"/>
        <circle cx="20" cy="21" r="5" fill="#702735"/>
        <text x="34" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#702735">Live WebSocket Synced</text>
        <text x="180" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#38251F" opacity="0.8">• 4 Active Skill Requests • Spring Security & JWT Enabled</text>
      </g>
    </g>
  </g>
</svg>
