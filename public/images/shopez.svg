<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgShop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1E3"/>
      <stop offset="50%" stop-color="#F3E2D2"/>
      <stop offset="100%" stop-color="#E5D1BE"/>
    </linearGradient>
    <filter id="shadowShop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#38251F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#bgShop)"/>

  <!-- Main Store & Dashboard Window -->
  <g transform="translate(80, 50)" filter="url(#shadowShop)">
    <rect width="640" height="400" rx="16" fill="#FFFFFF" stroke="#D8B99B" stroke-width="2"/>

    <!-- App Header Bar -->
    <rect width="640" height="46" rx="16" fill="#38251F"/>
    <rect y="30" width="640" height="16" fill="#38251F"/>
    <circle cx="28" cy="23" r="5" fill="#702735"/>
    <circle cx="44" cy="23" r="5" fill="#D8B99B"/>
    <circle cx="60" cy="23" r="5" fill="#FFF1E3"/>
    <text x="320" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFF1E3" text-anchor="middle" letter-spacing="1">SHOPEZ • FULL-STACK E-COMMERCE & ADMIN</text>

    <!-- Navigation / Category Ribbon -->
    <rect x="0" y="46" width="640" height="36" fill="#F8EFE7" stroke="#D8B99B" stroke-width="1"/>
    <text x="30" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#702735">SHOPEZ STORE</text>
    <text x="130" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#38251F">Catalog</text>
    <text x="190" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#38251F">Orders</text>
    <text x="250" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#702735">Admin Portal</text>
    
    <!-- Cart Pill -->
    <rect x="520" y="52" width="94" height="24" rx="12" fill="#702735"/>
    <text x="567" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#FFF1E3" text-anchor="middle">Cart (3 items)</text>

    <!-- Left side: Products Grid -->
    <g transform="translate(24, 98)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="170" rx="10" fill="#FAF2EB" stroke="#D8B99B" stroke-width="1.2"/>
        <rect x="20" y="16" width="140" height="74" rx="8" fill="#E6D3C2"/>
        <circle cx="90" cy="53" r="22" fill="#702735" fill-opacity="0.3"/>
        <text x="90" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#702735" text-anchor="middle">PRODUCT A</text>
        <text x="16" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#38251F">Ergonomic Gear</text>
        <text x="16" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#702735">$89.00</text>
        <rect x="110" y="120" width="56" height="22" rx="4" fill="#38251F"/>
        <text x="138" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#FFF1E3" text-anchor="middle">Add</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(200, 0)">
        <rect width="180" height="170" rx="10" fill="#FAF2EB" stroke="#D8B99B" stroke-width="1.2"/>
        <rect x="20" y="16" width="140" height="74" rx="8" fill="#E6D3C2"/>
        <circle cx="90" cy="53" r="22" fill="#D8B99B"/>
        <text x="90" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#38251F" text-anchor="middle">PRODUCT B</text>
        <text x="16" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#38251F">Studio Headphones</text>
        <text x="16" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#702735">$149.00</text>
        <rect x="110" y="120" width="56" height="22" rx="4" fill="#702735"/>
        <text x="138" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#FFF1E3" text-anchor="middle">Add</text>
      </g>

      <!-- Checkout & Status Banner -->
      <g transform="translate(0, 186)">
        <rect width="380" height="88" rx="10" fill="#FFF8F2" stroke="#D8B99B" stroke-width="1"/>
        <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#702735">Active Order Tracking Flow</text>
        <!-- Steps -->
        <circle cx="36" cy="50" r="10" fill="#702735"/>
        <text x="36" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFF1E3" text-anchor="middle">✓</text>
        <line x1="46" y1="50" x2="136" y2="50" stroke="#702735" stroke-width="2"/>
        <circle cx="146" cy="50" r="10" fill="#702735"/>
        <text x="146" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFF1E3" text-anchor="middle">✓</text>
        <line x1="156" y1="50" x2="246" y2="50" stroke="#D8B99B" stroke-width="2"/>
        <circle cx="256" cy="50" r="10" fill="#D8B99B"/>
        <text x="256" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#38251F" text-anchor="middle">3</text>
        <text x="36" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#38251F">Cart Confirmed</text>
        <text x="146" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#38251F">Paid (JWT Secure)</text>
        <text x="256" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#38251F">Out for Delivery</text>
      </g>
    </g>

    <!-- Right Side: Admin Metrics Dashboard Panel -->
    <g transform="translate(424, 98)">
      <rect width="192" height="274" rx="10" fill="#FAF2EB" stroke="#D8B99B" stroke-width="1.5"/>
      <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#38251F">ADMIN DASHBOARD</text>
      <text x="16" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#702735">Role-Based Access Control</text>

      <!-- Mini Chart Simulation -->
      <g transform="translate(16, 56)">
        <rect width="160" height="90" rx="6" fill="#FFFFFF" stroke="#D8B99B" stroke-width="1"/>
        <text x="10" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#38251F">Sales Volume Overview</text>
        <!-- Bar bars -->
        <rect x="18" y="50" width="16" height="30" rx="2" fill="#D8B99B"/>
        <rect x="44" y="38" width="16" height="42" rx="2" fill="#D8B99B"/>
        <rect x="70" y="44" width="16" height="36" rx="2" fill="#702735"/>
        <rect x="96" y="30" width="16" height="50" rx="2" fill="#702735"/>
        <rect x="122" y="24" width="16" height="56" rx="2" fill="#38251F"/>
      </g>

      <!-- Metric 1 -->
      <g transform="translate(16, 160)">
        <rect width="160" height="42" rx="6" fill="#FFFFFF" stroke="#D8B99B" stroke-width="1"/>
        <text x="12" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#38251F" opacity="0.8">Inventory Management</text>
        <text x="12" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#702735">142 Active Products</text>
      </g>

      <!-- Metric 2 -->
      <g transform="translate(16, 212)">
        <rect width="160" height="42" rx="6" fill="#FFFFFF" stroke="#D8B99B" stroke-width="1"/>
        <text x="12" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#38251F" opacity="0.8">API Endpoint Status</text>
        <text x="12" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#38251F">Express + Mongo REST</text>
      </g>
    </g>
  </g>
</svg>
