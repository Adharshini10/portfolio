<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1E3"/>
      <stop offset="50%" stop-color="#F5E4D4"/>
      <stop offset="100%" stop-color="#E8D1BC"/>
    </linearGradient>
    <filter id="shadowBlood" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#38251F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#bgBlood)"/>

  <!-- Hospital & Map Finder Window -->
  <g transform="translate(80, 50)" filter="url(#shadowBlood)">
    <rect width="640" height="400" rx="16" fill="#FFFFFF" stroke="#D8B99B" stroke-width="2"/>

    <!-- App Header Bar -->
    <rect width="640" height="46" rx="16" fill="#38251F"/>
    <rect y="30" width="640" height="16" fill="#38251F"/>
    <circle cx="28" cy="23" r="5" fill="#702735"/>
    <circle cx="44" cy="23" r="5" fill="#D8B99B"/>
    <circle cx="60" cy="23" r="5" fill="#FFF1E3"/>
    <text x="320" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFF1E3" text-anchor="middle" letter-spacing="1">BLOOD CARE • NEARBY HOSPITALS & AVAILABILITY</text>

    <!-- Map View Canvas Simulation -->
    <g transform="translate(24, 66)">
      <rect width="360" height="308" rx="10" fill="#F8EFE7" stroke="#D8B99B" stroke-width="1.5"/>

      <!-- Map Roads / Grid -->
      <path d="M 0,90 Q 140,80 200,140 T 360,180" fill="none" stroke="#E5D1BE" stroke-width="12"/>
      <path d="M 80,0 L 140,308" fill="none" stroke="#E5D1BE" stroke-width="8"/>
      <path d="M 280,0 L 220,308" fill="none" stroke="#E5D1BE" stroke-width="10"/>

      <!-- Map Pin 1 (Primary Hospital) -->
      <g transform="translate(180, 120)">
        <circle cx="0" cy="0" r="18" fill="#702735" filter="drop-shadow(0 4px 6px rgba(112,39,53,0.3))"/>
        <!-- Cross symbol -->
        <rect x="-3" y="-10" width="6" height="20" rx="2" fill="#FFF1E3"/>
        <rect x="-10" y="-3" width="20" height="6" rx="2" fill="#FFF1E3"/>
        <!-- Radar Pulse -->
        <circle cx="0" cy="0" r="28" fill="none" stroke="#702735" stroke-width="1.5" stroke-dasharray="4 4"/>
      </g>

      <!-- Pin 2 -->
      <g transform="translate(90, 220)">
        <circle cx="0" cy="0" r="14" fill="#38251F"/>
        <rect x="-2" y="-7" width="4" height="14" rx="1" fill="#D8B99B"/>
        <rect x="-7" y="-2" width="14" height="4" rx="1" fill="#D8B99B"/>
      </g>

      <!-- Pin 3 -->
      <g transform="translate(290, 70)">
        <circle cx="0" cy="0" r="14" fill="#38251F"/>
        <rect x="-2" y="-7" width="4" height="14" rx="1" fill="#D8B99B"/>
        <rect x="-7" y="-2" width="14" height="4" rx="1" fill="#D8B99B"/>
      </g>

      <!-- Location floating card on map -->
      <g transform="translate(16, 230)">
        <rect width="240" height="64" rx="8" fill="#FFFFFF" stroke="#D8B99B" stroke-width="1" filter="drop-shadow(0 4px 8px rgba(56,37,31,0.08))"/>
        <circle cx="26" cy="32" r="12" fill="#702735" fill-opacity="0.15"/>
        <circle cx="26" cy="32" r="5" fill="#702735"/>
        <text x="48" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#38251F">City Central Hospital</text>
        <text x="48" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#702735" font-weight="600">1.8 km away • O-, A+, B+ in stock</text>
      </g>
    </g>

    <!-- Right Side: Blood Group Selector & Request Hub -->
    <g transform="translate(404, 66)">
      <rect width="212" height="308" rx="10" fill="#FAF2EB" stroke="#D8B99B" stroke-width="1.5"/>
      <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#38251F">SEARCH BY BLOOD GROUP</text>

      <!-- Blood group pills grid -->
      <g transform="translate(16, 38)">
        <rect width="40" height="30" rx="6" fill="#702735"/>
        <text x="20" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFF1E3" text-anchor="middle">A+</text>

        <rect x="48" width="40" height="30" rx="6" fill="#FFFFFF" stroke="#D8B99B"/>
        <text x="68" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#38251F" text-anchor="middle">A-</text>

        <rect x="96" width="40" height="30" rx="6" fill="#FFFFFF" stroke="#D8B99B"/>
        <text x="116" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#38251F" text-anchor="middle">B+</text>

        <rect x="144" width="40" height="30" rx="6" fill="#FFFFFF" stroke="#D8B99B"/>
        <text x="164" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#38251F" text-anchor="middle">O+</text>
      </g>

      <!-- Blood Availability List -->
      <text x="16" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#702735">HOSPITAL AVAILABILITY UPDATES</text>

      <!-- Hospital item 1 -->
      <g transform="translate(16, 110)">
        <rect width="180" height="54" rx="8" fill="#FFFFFF" stroke="#D8B99B"/>
        <text x="12" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#38251F">City Care Center</text>
        <text x="12" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#38251F" opacity="0.75">Status: 8 Units Available</text>
        <rect x="120" y="16" width="48" height="22" rx="4" fill="#702735"/>
        <text x="144" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#FFF1E3" text-anchor="middle">Request</text>
      </g>

      <!-- Hospital item 2 -->
      <g transform="translate(16, 172)">
        <rect width="180" height="54" rx="8" fill="#FFFFFF" stroke="#D8B99B"/>
        <text x="12" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#38251F">Sunrise Clinic</text>
        <text x="12" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#38251F" opacity="0.75">Status: Verified 10m ago</text>
        <rect x="120" y="16" width="48" height="22" rx="4" fill="#38251F"/>
        <text x="144" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#FFF1E3" text-anchor="middle">Call</text>
      </g>

      <!-- Firebase Realtime Sync Status -->
      <g transform="translate(16, 240)">
        <rect width="180" height="42" rx="6" fill="#FFF1E3" stroke="#D8B99B"/>
        <circle cx="16" cy="21" r="4" fill="#702735"/>
        <text x="26" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#702735">Firebase Realtime DB</text>
        <text x="26" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#38251F" opacity="0.8">Instant emergency alerts & updates</text>
      </g>
    </g>
  </g>
</svg>
